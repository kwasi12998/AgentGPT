<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeakingStage – So einfach geht's</title>
<style>
  @font-face{font-family:IN;font-weight:500;src:url(assets/fonts/Inter-Medium.otf)}
  @font-face{font-family:IN;font-weight:600;src:url(assets/fonts/Inter-SemiBold.otf)}
  @font-face{font-family:ID;font-weight:500;src:url(assets/fonts/InterDisplay-Medium.otf)}
  @font-face{font-family:ID;font-weight:600;src:url(assets/fonts/InterDisplay-SemiBold.otf)}
  @font-face{font-family:ID;font-weight:700;src:url(assets/fonts/InterDisplay-Bold.otf)}
  :root{--navy:#162131;--ink:#1d2533;--copper:#a7643c;--copperD:#8c5130;--copperL:#d9a074;--cream:#f7f3ee;--sand:#f3ece4;--line:#ebe3d9;--muted:#6f6a64}
  html,body{margin:0;background:#fff;overflow:hidden}
  #fit{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
  #vp{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:IN,Inter,system-ui,sans-serif;color:var(--ink);transform-origin:0 0}
  .scene{position:absolute;inset:0;perspective:2400px;perspective-origin:960px 540px;overflow:hidden;display:none}
  .world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:0 0}
  .abs{position:absolute}
  .d{font-family:ID,Inter,system-ui,sans-serif}
  .bw{position:absolute;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 60px 140px -30px rgba(22,33,49,.30),0 14px 34px rgba(22,33,49,.10);border:1px solid var(--line)}
  .bwbar{height:48px;background:#f7f2ec;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 18px;position:relative}
  .bwbar i{width:12px;height:12px;border-radius:50%;background:#e3d7ca;display:block}
  .bwurl{position:absolute;left:50%;top:9px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 22px;font:500 15px IN;color:#6b6157;white-space:nowrap}
  .bwview{position:relative;overflow:hidden}
  .layer{position:absolute;left:0;top:0;width:100%}
  .card{position:absolute;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 40px 90px -30px rgba(22,33,49,.25),0 8px 22px rgba(22,33,49,.06)}
  .chip{display:inline-block;padding:7px 14px;border-radius:999px;background:#f6eee6;color:#7a4a2c;font:500 15px IN;margin:0 6px 6px 0;border:1px solid #efe1d3}
  .cap{position:absolute;left:50%;top:960px;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--line);box-shadow:0 20px 50px -18px rgba(22,33,49,.28);border-radius:999px;padding:18px 38px;font:600 36px ID;color:var(--navy);white-space:nowrap;opacity:0;letter-spacing:-.01em}
  em{font-style:normal;color:var(--copper)}
  .cap em{font-style:normal;color:var(--copper)}
  .cap.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
  .cap.dark em{color:var(--copperL)}
  .big{position:absolute;left:0;width:1920px;text-align:center;font:700 140px/1.02 ID;color:var(--navy);letter-spacing:-.035em}
  .big em{font-style:normal;color:var(--copper)}
  .w{display:inline-block;will-change:transform,opacity}
  .cur{position:absolute;left:0;top:0;width:40px;height:40px;z-index:50;filter:drop-shadow(0 6px 10px rgba(22,33,49,.3))}
  .rip{position:absolute;border-radius:50%;border:3px solid var(--copper);z-index:49;opacity:0;pointer-events:none}
  .caret{display:inline-block;width:3px;height:1.05em;background:var(--copper);vertical-align:-.15em;margin-left:2px}
  .btn{position:absolute;background:var(--copper);color:#fff;border-radius:999px;font:600 22px IN;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 14px 30px -10px rgba(167,100,60,.6)}
  .lbl{font:600 15px IN;letter-spacing:.16em;color:var(--copper);text-transform:uppercase}
  .mark{background:var(--navy);-webkit-mask:url(assets/ui/mark.png) center/contain no-repeat;mask:url(assets/ui/mark.png) center/contain no-repeat}
  #start{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#fff;cursor:pointer;z-index:9;font-family:ID,system-ui}
  #start b{font:700 56px ID;color:var(--navy)} #start span{font:600 16px IN;letter-spacing:.2em;color:var(--copper)}
  #start i{justify-self:center;width:84px;height:84px;border-radius:50%;background:var(--copper);display:grid;place-items:center;color:#fff;font-style:normal;font-size:30px}
</style>
</head>
<body>
<div id="fit"><div id="vp"></div></div>
<div id="start"><span>SPEAKINGSTAGE</span><b>So einfach geht's.</b><i>▶</i><span>MIT TON · LEERTASTE = PAUSE</span></div>
<audio id="aud" src="assets/music.m4a" preload="auto"></audio>
<script src="assets/manifest.js"></script>
<script>
/* ==================================================================
   SpeakingStage · Erklärvideo (3:00)
   DOM + CSS-3D. render(t) ist eine reine Funktion der Zeit.
   ?render=1 → Export-Modus (Playwright), ?t=… → Standbild
   ================================================================== */
const W=1920,H=1080,FPS=30,DUR=180;
const Q=new URLSearchParams(location.search),RENDER=Q.has('render'),STILL=Q.has('t')?+Q.get('t'):null;
const vp=document.getElementById('vp');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t,P=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const E={lin:x=>x,outC:x=>1-Math.pow(1-x,3),outQ5:x=>1-Math.pow(1-x,5),ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  io5:x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2,outX:x=>x>=1?1:1-Math.pow(2,-10*x),
  outB:x=>{const s=1.5;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)},ioS:x=>x*x*(3-2*x)};

/* ---------- DOM-Helfer ---------- */
function el(tag,cls,style,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(html!=null)e.innerHTML=html;(parent||vp).appendChild(e);return e}
const px=v=>v+'px';
function css(e,o){const s=e._s||(e._s={});for(const k in o){const v=o[k];if(s[k]!==v){e.style[k]=v;s[k]=v}}}
function img(src,style,parent){const i=el('img','abs',style,parent);i.src=src;i.decoding='sync';return i}
const SP=n=>`assets/sp/${n}.jpg`;
const NAME=Object.fromEntries(SPK.map(s=>[s.slug,s.name]));

/* ---------- Sounddesign-Ereignisse (werden für den Musik-Mix exportiert) ---------- */
const EV=[];const sfx=(t,type,v=1)=>EV.push({t:+t.toFixed(3),type,v});
function typeSfx(t0,str,cps){for(let i=0;i<str.length;i++)if(str[i]!==' '||i%3===0)sfx(t0+i/cps,'key',.6+rnd(i)*.4)}

/* ---------- Szenen & Kamera ---------- */
const SC=[];
function Scene(t0,t1,build,o={}){const root=el('div','scene',{},vp);const world=el('div','world',{},root);const s={t0,t1,root,world,fi:o.fi||0,fo:o.fo||0};build(s);SC.push(s);return s}
function keys(list){const out=[];let prev={x:960,y:540,z:1,rx:0,ry:0,rz:0};for(const [t,k] of list){prev={...prev,...k};out.push([t,prev])}return out}
function interp(t,K,ease=E.io5){if(t<=K[0][0])return K[0][1];for(let i=0;i<K.length-1;i++){const[a,A]=K[i],[b,B]=K[i+1];if(t<b){const p=ease(P(t,a,b)),o={};for(const k in A)o[k]=lerp(A[k],B[k],p);return o}}return K[K.length-1][1]}
// Kamera auf die Welt anwenden – inklusive Bewegungsunschärfe aus der Geschwindigkeit
function camera(s,lt,K,ease){const c=interp(lt,K,ease),c2=interp(lt-1/FPS,K,ease);
  const v=Math.hypot((c.x-c2.x)*c.z,(c.y-c2.y)*c.z)*FPS+Math.abs(c.ry-c2.ry)*FPS*14+Math.abs(c.z-c2.z)*FPS*700;
  css(s.world,{transform:`translate3d(960px,540px,0) rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) rotateZ(${c.rz.toFixed(3)}deg) scale(${c.z.toFixed(4)}) translate3d(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px,0)`,
    filter:v>900?`blur(${Math.min(14,(v-900)/650).toFixed(1)}px)`:'none'});return c}

/* ---------- Bausteine ---------- */
function browser(p,x,y,src,{w=1440,h=900,url='speakingstage.com'}={}){
  const r=el('div','bw',{left:px(x),top:px(y),width:px(w),height:px(h+48)},p);
  el('div','bwbar',{},r,`<i></i><i></i><i></i><span class="bwurl">🔒&nbsp; ${url}</span>`);
  const view=el('div','bwview',{height:px(h)},r);const layer=el('div','layer',{},view);
  const im=src?img(src,{left:0,top:0,width:px(w)},layer):null;return {r,view,layer,im,x,y}}
const CURSVG=`<svg width="40" height="40" viewBox="0 0 24 24"><path d="M4.5 2.5l14.5 9-6.3 1.3 3.6 7.1-2.8 1.4-3.6-7.2-5.4 3.9z" fill="#162131" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
function cursor(p){return {c:el('div','cur',{opacity:0},p,CURSVG),r:el('div','rip',{},p)}}
// Pfad: [[t,x,y],...], Klicks: [t,...]  (lokale Zeiten)
function drive(cur,lt,path,clicks=[],vis=[0,1e9]){
  const K=keys(path.map(([t,x,y])=>[t,{x,y}]));const c=interp(lt,K,E.ioC);
  let sc=1,last=null;for(const ct of clicks){if(lt>=ct-.12&&lt<ct+.18)sc=lt<ct?lerp(1,.78,P(lt,ct-.12,ct)):lerp(.78,1,P(lt,ct,ct+.18));if(lt>=ct)last=ct}
  css(cur.c,{opacity:String(clamp(Math.min((lt-vis[0])/.25,(vis[1]-lt)/.25))),transform:`translate(${c.x-6}px,${c.y-4}px) scale(${sc})`});
  if(last!=null&&lt-last<.7){const q=E.outC(P(lt,last,last+.7)),r=12+q*70;css(cur.r,{opacity:String(1-q),left:px(c.x-r),top:px(c.y-r),width:px(r*2),height:px(r*2)})}else css(cur.r,{opacity:'0'});
  return c}
const typed=(str,lt,t0,cps)=>str.slice(0,clamp(Math.floor((lt-t0)*cps),0,str.length));
const caretOn=(lt,t0,t1)=>lt>=t0&&(lt<t1+.05||Math.floor(lt*2.2)%2===0);
// Wort-für-Wort-Reveal in einem Element
function words(e,html){html=html.replace(/<em>(.*?)<\/em>/g,(m,x)=>x.split(' ').map(w=>`<em>${w}</em>`).join(' '));
  e.innerHTML=html.split(/(<br>|\s+)/).map(w=>w==='<br>'?'<br>':/^\s*$/.test(w)?w:`<span class="w">${w}</span>`).join('');return [...e.querySelectorAll('.w')]}
function revealWords(ws,lt,t0,step=.09,dur=.55,dy=40){ws.forEach((w,i)=>{const p=E.outQ5(P(lt,t0+i*step,t0+i*step+dur));css(w,{opacity:String(p),transform:`translateY(${(1-p)*dy}px)`,filter:p<1?`blur(${((1-p)*10).toFixed(1)}px)`:'none'})})}
function fadeUp(e,lt,t0,t1=1e9,dy=30,dur=.55){const a=E.outQ5(P(lt,t0,t0+dur)),b=E.ioC(P(lt,t1-.4,t1)),o=a*(1-b);css(e,{opacity:String(o),transform:`translateY(${((1-a)*dy-b*dy*.6).toFixed(1)}px)`,filter:o<.99?`blur(${((1-o)*8).toFixed(1)}px)`:'none'})}

/* ---------- Untertitel (Bildschirm-Ebene) ---------- */
const CAPS=[];function cap(t0,t1,html,dark=false){CAPS.push({t0,t1,html,dark})}
let capLayer;
function buildCaps(){capLayer=el('div','abs',{inset:0,zIndex:80,pointerEvents:'none'});CAPS.forEach(c=>{c.e=el('div','cap'+(c.dark?' dark':''),{},capLayer,c.html)})}
function drawCaps(t){CAPS.forEach(c=>{if(t<c.t0-.1||t>c.t1+.1){css(c.e,{display:'none'});return}const a=E.outQ5(P(t,c.t0,c.t0+.5)),b=E.ioC(P(t,c.t1-.35,c.t1)),o=a*(1-b);
  css(c.e,{display:'block',opacity:String(o),transform:`translate(-50%,-50%) translateY(${((1-a)*36-b*16).toFixed(1)}px) scale(${(.96+.04*a).toFixed(3)})`,filter:o<.99?`blur(${((1-o)*10).toFixed(1)}px)`:'none'})})}

/* ==================================================================
   AKT I · Kaltstart (0–13)
   ================================================================== */
const S1T=[['Wir brauchen einen Keynote Speaker.',.7,19],[' Für 300 Gäste.',3.3,16],[' In acht Wochen.',4.6,16]];
S1T.forEach(([s,t,c])=>typeSfx(t,s,c));
Scene(0,7.2,s=>{
  const note=el('div','card',{left:'200px',top:'340px',width:'1520px',height:'400px'},s.world);
  el('div','abs',{left:'56px',top:'40px',font:'600 22px IN',color:'#9a8f84',letterSpacing:'.02em'},note,'Notizen · Jahrestagung 2027');
  el('div','abs',{left:'56px',top:'84px',width:'1408px',height:'1px',background:'var(--line)'},note);
  s.tx=el('div','abs d',{left:'56px',top:'130px',width:'1400px',font:'600 74px/1.18 ID',color:'var(--navy)',letterSpacing:'-.02em'},note);
  s.K=keys([[0,{x:960,y:560,z:.92,ry:-12,rx:6}],[5.9,{x:1010,y:560,z:1.12,ry:2,rx:1}],[7.2,{x:960,y:520,z:1.9,ry:8,rx:-4}]]);
  s.update=lt=>{camera(s,lt,s.K,E.ioS);let txt='',last=0;S1T.forEach(([str,t0,c])=>{txt+=typed(str,lt,t0,c);if(lt>t0)last=t0+str.length/c});
    s.tx.innerHTML=txt.replace('Keynote Speaker','<span style="color:var(--copper)">Keynote Speaker</span>')+(caretOn(lt,0,last)?'<span class="caret"></span>':'');
    css(s.root,{opacity:String(1-P(lt,6.5,7.2))})};
});
Scene(7,13.2,s=>{
  s.a=el('div','big',{top:'440px'},s.world);s.wa=words(s.a,'Klingt einfach.');
  s.b=el('div','big',{top:'440px'},s.world);s.wb=words(s.b,'Ist es <em>selten.</em>');
  s.K=keys([[0,{z:.96,rx:4}],[5,{z:1.06,rx:-2}],[6.2,{z:2.4,y:500}]]);
  s.update=lt=>{camera(s,lt,s.K,E.ioS);revealWords(s.wa,lt,.25,.14,.7,60);css(s.a,{opacity:String(1-P(lt,2.4,2.8)),transform:`translateY(${-P(lt,2.4,2.8)*80}px)`});
    revealWords(s.wb,lt,2.75,.16,.7,60);css(s.root,{opacity:String(1-P(lt,5.7,6.2))})};
});
sfx(7.25,'pop',.5);sfx(9.8,'pop',.6);

/* ==================================================================
   AKT II · Das Problem (13–34)
   ================================================================== */
Scene(13,21.3,s=>{
  const cols=14,rows=13,cw=210,ch=268,g=26;s.cards=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const k=(r*cols+c)*7%SPK.length,sp=SPK[k];
    const e=el('div','card',{left:px(c*(cw+g)-cols*(cw+g)/2+960),top:px(r*(ch+g)-200),width:px(cw),height:px(ch),borderRadius:'18px',overflow:'hidden'},s.world);
    img(SP(sp.slug),{left:0,top:0,width:px(cw),height:px(cw),objectFit:'cover'},e);
    el('div','abs',{left:'14px',top:px(cw+12),font:'600 17px IN',color:'var(--navy)',whiteSpace:'nowrap',overflow:'hidden',width:px(cw-28)},e,sp.name);
    el('div','abs',{left:'14px',top:px(cw+36),font:'500 13px IN',color:'#9a8f84'},e,'Keynote Speaker');s.cards.push(e)}
  s.veil=el('div','abs',{inset:'0',background:'radial-gradient(ellipse 62% 42% at 50% 50%,rgba(255,255,255,.96) 0%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 100%)'},s.root);
  s.big=el('div','big',{top:'380px',fontSize:'128px',textShadow:'0 0 60px #fff,0 0 30px #fff'},s.root);s.wb=words(s.big,'Hunderte Profile.<br>Alle klingen gut.');
  s.big2=el('div','big',{top:'450px',fontSize:'104px',textShadow:'0 0 60px #fff,0 0 30px #fff'},s.root);s.wb2=words(s.big2,'Aber welcher passt<br>zu <em>Ihrem</em> Event?');
  s.K=keys([[0,{x:960,y:3100,z:.5,rx:58,rz:-14}],[4.6,{x:960,y:1800,z:.62,rx:52,rz:-6}],[8.3,{x:1000,y:700,z:.78,rx:40,rz:6}]]);
  s.update=lt=>{camera(s,lt,s.K,E.ioS);
    s.cards.forEach((e,i)=>{const j=P(lt,4.8+rnd(i)*1.5,6.5+rnd(i)*1.5);css(e,{transform:`translateZ(${(Math.sin(lt*2+i)*30*j).toFixed(1)}px) rotateY(${(j*rnd(i+5)*120*(i%2?1:-1)).toFixed(1)}deg)`,opacity:String(1-j*.65)})});
    css(s.world,{opacity:String(1-.5*P(lt,4.8,6))});css(s.veil,{opacity:String(P(lt,.4,1.0))});
    revealWords(s.wb,lt,.6,.12,.6,50);css(s.big,{opacity:String(1-P(lt,4.2,4.6))});
    revealWords(s.wb2,lt,4.75,.11,.6,50);css(s.root,{opacity:String(1-P(lt,7.9,8.3))})};
});
sfx(13.2,'whoosh',.7);sfx(17.75,'pop',.5);

Scene(21,28.8,s=>{
  // drei schwebende Problem-Karten im Raum
  const A=el('div','card',{left:'240px',top:'300px',width:'720px',height:'470px'},s.world);
  el('div','abs',{left:'40px',top:'38px',width:'86px',height:'86px',borderRadius:'50%',background:'#eee6dd'},A);
  el('div','abs',{left:'148px',top:'48px',width:'300px',height:'22px',borderRadius:'11px',background:'#e8dfd5'},A);
  el('div','abs',{left:'148px',top:'86px',width:'210px',height:'16px',borderRadius:'8px',background:'#f0e9e1'},A);
  el('div','abs',{left:'40px',top:'170px',width:'640px',height:'1px',background:'var(--line)'},A);
  el('div','abs',{left:'40px',top:'206px',font:'600 20px IN',color:'#9a8f84',letterSpacing:'.08em'},A,'HONORAR');
  el('div','abs d',{left:'40px',top:'240px',font:'700 64px ID',color:'var(--navy)'},A,'auf Anfrage');
  s.qa=el('div','abs d',{left:'560px',top:'210px',width:'110px',height:'110px',borderRadius:'50%',background:'var(--copper)',color:'#fff',font:'700 70px/110px ID',textAlign:'center'},A,'?');
  el('div','abs',{left:'40px',top:'370px',width:'250px',height:'18px',borderRadius:'9px',background:'#f0e9e1'},A);
  el('div','abs',{left:'40px',top:'402px',width:'380px',height:'18px',borderRadius:'9px',background:'#f0e9e1'},A);
  s.ta=el('div','abs d',{left:'1010px',top:'440px',width:'640px',font:'700 78px/1.05 ID',color:'var(--navy)',letterSpacing:'-.03em'},s.world,'Was kostet<br>das eigentlich?');
  // Kalender
  const B=el('div','card',{left:'2080px',top:'180px',width:'640px',height:'600px',transform:'translateZ(-200px)'},s.world);
  el('div','abs d',{left:'40px',top:'34px',font:'700 40px ID',color:'var(--navy)'},B,'Juni 2027');
  const days='MO DI MI DO FR SA SO'.split(' ');days.forEach((d,i)=>el('div','abs',{left:px(46+i*80),top:'110px',font:'600 15px IN',color:'#9a8f84'},B,d));
  for(let i=0;i<30;i++){const c=(i+1)%7,r=Math.floor((i+1)/7);el('div','abs',{left:px(36+c*80),top:px(150+r*84),width:'64px',height:'64px',borderRadius:'50%',font:'600 24px/64px IN',textAlign:'center',color:i===17?'var(--copper)':'var(--ink)'},B,String(i+1))}
  s.ring=el('div','abs',{left:px(36+((18)%7)*80-8),top:px(150+Math.floor(18/7)*84-8),width:'80px',height:'80px',borderRadius:'50%',border:'5px solid var(--copper)'},B);
  s.qb=el('div','abs',{left:'420px',top:'40px',padding:'10px 18px',borderRadius:'999px',background:'#fbefe6',color:'var(--copper)',font:'600 20px IN'},B,'verfügbar?');
  s.tb=el('div','abs d',{left:'2780px',top:'330px',width:'700px',font:'700 78px/1.05 ID',color:'var(--navy)',letterSpacing:'-.03em',transform:'translateZ(-200px)'},s.world,'Ist der Termin<br>überhaupt frei?');
  // Mail
  const Cc=el('div','card',{left:'3900px',top:'320px',width:'760px',height:'480px',transform:'translateZ(120px)'},s.world);
  el('div','abs',{left:'40px',top:'36px',font:'600 18px IN',color:'#9a8f84'},Cc,'Von: Geschäftsführung');
  el('div','abs',{left:'40px',top:'68px',font:'600 18px IN',color:'#9a8f84'},Cc,'An: Event-Team');

function render(t){t=clamp(t,0,DUR);for(const s of SC){const on=t>=s.t0&&t<s.t1;css(s.root,{display:on?'block':'none'});if(on)s.update(t-s.t0,t)}drawCaps(t)}

async function settle(){await Promise.all([...document.images].filter(i=>!i.complete).map(i=>new Promise(r=>{i.onload=i.onerror=r})));await Promise.all([...vp.querySelectorAll('img')].filter(i=>i.offsetParent!==null).map(i=>i.decode().catch(()=>{})))}
window.renderAt=async t=>{render(t);await settle();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
function fitView(){if(RENDER)return;const s=Math.min(innerWidth/W,innerHeight/H);vp.style.transform=`scale(${s})`;vp.parentElement.style.cssText+=`;width:${W*s}px;height:${H*s}px`;document.getElementById('fit').style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff'}
addEventListener('resize',fitView);
const aud=document.getElementById('aud');let playing=false;
function loop(){if(!playing)return;render(aud.currentTime);if(aud.ended){playing=false;return}requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>{document.getElementById('start').style.display='none';playing=true;aud.currentTime=0;aud.play();loop()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(playing){playing=false;aud.pause()}else{playing=true;aud.play();loop()}}});
document.fonts.ready.then(()=>{fitView();if(RENDER||STILL!==null){document.getElementById('start').style.display='none'}render(STILL??0);window.__ready=true});
