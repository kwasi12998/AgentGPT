<html lang="de">
<head>

<style>
  @font-face{font-family:IN;font-weight:500;src:url(assets/fonts/Inter-Medium.otf)}
  @font-face{font-family:IN;font-weight:600;src:url(assets/fonts/Inter-SemiBold.otf)}
  @font-face{font-family:ID;font-weight:500;src:url(assets/fonts/InterDisplay-Medium.otf)}

  :root{--navy:#162131;--ink:#1d2533;--copper:#a7643c;--copperD:#8c5130;--copperL:#d9a074;--cream:#f7f3ee;--sand:#f3ece4;--line:#ebe3d9;--muted:#6f6a64}

  #vp{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;font-family:IN,Inter,system-ui,sans-serif;color:var(--ink);transform-origin:0 0}

  .sub{position:absolute;left:540px;top:1655px;max-width:900px;transform:translate(-50%,-50%);padding:18px 30px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 18px 44px -16px rgba(22,33,49,.35);border:1px solid var(--line);font:600 40px/1.28 ID;color:var(--navy);text-align:center;letter-spacing:-.01em;width:max-content;opacity:0}

  .book img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="fit"><div id="vp"></div></div>
<div id="start"><span>SPEAKINGSTAGE</span><b>Über Leben</b><i>▶</i><span>MIT TON · LEERTASTE = PAUSE</span></div>
<audio id="aud" src="assets/ueber-leben/mix.m4a" preload="auto"></audio>
<script>
/* ==================================================================
   „Über Leben“ · Meckel & Steinacker · Buchvideo 9:16 (85 s)
   DOM + CSS-3D. render(t) ist eine reine Funktion der Zeit.
   ?render=1 → Export-Modus (Playwright), ?t=… → Standbild
   ================================================================== */
const W=1080,H=1920,FPS=30,DUR=85.0;
const Q=new URLSearchParams(location.search),RENDER=Q.has('render'),STILL=Q.has('t')?+Q.get('t'):null;
const vp=document.getElementById('vp');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t,P=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const E={lin:x=>x,outC:x=>1-Math.pow(1-x,3),outQ5:x=>1-Math.pow(1-x,5),ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  io5:x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2,outX:x=>x>=1?1:1-Math.pow(2,-10*x),
  outB:x=>{const s=1.5;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)},ioS:x=>x*x*(3-2*x)};

/* ---------- DOM-Helfer ---------- */
function el(tag,cls,style,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(html!=null)e.innerHTML=html;(parent||vp).appendChild(e);return e}
const px=v=>v+'px';
function css(e,o){const s=e._s||(e._s={});for(const k in o){const v=o[k];if(s[k]!==v){e.style[k]=v;s[k]=v}}}
function img(src,style,parent){const i=el('img','abs',style,parent);i.src=src;i.decoding='sync';return i}

/* ---------- Sounddesign-Ereignisse (werden für den Musik-Mix exportiert) ---------- */
const EV=[];const sfx=(t,type,v=1)=>EV.push({t:+t.toFixed(3),type,v});
function typeSfx(t0,str,cps){for(let i=0;i<str.length;i++)if(str[i]!==' '||i%3===0)sfx(t0+i/cps,'key',.6+rnd(i)*.4)}

/* ---------- Szenen & Kamera ---------- */
const SC=[];
function Scene(t0,t1,build,o={}){const root=el('div','scene',{},vp);const world=el('div','world',{},root);const s={t0,t1,root,world,fi:o.fi||0,fo:o.fo||0};build(s);SC.push(s);return s}
function keys(list){const out=[];let prev={x:540,y:960,z:1,rx:0,ry:0,rz:0};for(const [t,k] of list){prev={...prev,...k};out.push([t,prev])}return out}
function interp(t,K,ease=E.io5){if(t<=K[0][0])return K[0][1];for(let i=0;i<K.length-1;i++){const[a,A]=K[i],[b,B]=K[i+1];if(t<b){const p=ease(P(t,a,b)),o={};for(const k in A)o[k]=lerp(A[k],B[k],p);return o}}return K[K.length-1][1]}
// Kamera auf die Welt anwenden – inklusive Bewegungsunschärfe aus der Geschwindigkeit
function camera(s,lt,K,ease){const c=interp(lt,K,ease),c2=interp(lt-1/FPS,K,ease);
  const v=Math.hypot((c.x-c2.x)*c.z,(c.y-c2.y)*c.z)*FPS+Math.abs(c.ry-c2.ry)*FPS*14+Math.abs(c.z-c2.z)*FPS*700;
  css(s.world,{transform:`translate3d(540px,960px,0) rotateX(${c.rx.toFixed(3)}deg) rotateY(${c.ry.toFixed(3)}deg) rotateZ(${c.rz.toFixed(3)}deg) scale(${c.z.toFixed(4)}) translate3d(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px,0)`,
    filter:v>900?`blur(${Math.min(14,(v-900)/650).toFixed(1)}px)`:'none'});return c}

/* ---------- Bausteine ---------- */
function browser(p,x,y,src,{w=1440,h=900,url='speakingstage.com'}={}){
  const r=el('div','bw',{left:px(x),top:px(y),width:px(w),height:px(h+48)},p);
  el('div','bwbar',{},r,`<i></i><i></i><i></i><span class="bwurl">🔒&nbsp; ${url}</span>`);
  const view=el('div','bwview',{height:px(h)},r);const layer=el('div','layer',{},view);
  const im=src?img(src,{left:0,top:0,width:px(w)},layer):null;return {r,view,layer,im,x,y}}
const CURSVG=`<svg width="40" height="40" viewBox="0 0 24 24"><path d="M4.5 2.5l14.5 9-6.3 1.3 3.6 7.1-2.8 1.4-3.6-7.2-5.4 3.9z" fill="#162131" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
function cursor(p){return {c:el('div','cur',{opacity:0},p,CURSVG),r:el('div','rip',{},p)}}
// Pfad: [[t,x,y],...], Klicks: [t,...]  (lokale Zeiten)
function drive(cur,lt,path,clicks=[],vis=[0,1e9]){
  const K=keys(path.map(([t,x,y])=>[t,{x,y}]));const c=interp(lt,K,E.ioC);
  let sc=1,last=null;for(const ct of clicks){if(lt>=ct-.12&&lt<ct+.18)sc=lt<ct?lerp(1,.78,P(lt,ct-.12,ct)):lerp(.78,1,P(lt,ct,ct+.18));if(lt>=ct)last=ct}
  css(cur.c,{opacity:String(clamp(Math.min((lt-vis[0])/.25,(vis[1]-lt)/.25))),transform:`translate(${c.x-6}px,${c.y-4}px) scale(${sc})`});
  if(last!=null&&lt-last<.7){const q=E.outC(P(lt,last,last+.7)),r=12+q*70;css(cur.r,{opacity:String(1-q),left:px(c.x-r),top:px(c.y-r),width:px(r*2),height:px(r*2)})}else css(cur.r,{opacity:'0'});
  return c}
const typed=(str,lt,t0,cps)=>str.slice(0,clamp(Math.floor((lt-t0)*cps),0,str.length));
const caretOn=(lt,t0,t1)=>lt>=t0&&(lt<t1+.05||Math.floor(lt*2.2)%2===0);
// Wort-für-Wort-Reveal in einem Element
function words(e,html){html=html.replace(/<em>(.*?)<\/em>/g,(m,x)=>x.split(' ').map(w=>`<em>${w}</em>`).join(' '));
  e.innerHTML=html.split(/(<br>|\s+)/).map(w=>w==='<br>'?'<br>':/^\s*$/.test(w)?w:`<span class="w">${w}</span>`).join('');return [...e.querySelectorAll('.w')]}
function revealWords(ws,lt,t0,step=.09,dur=.55,dy=40){ws.forEach((w,i)=>{const p=E.outQ5(P(lt,t0+i*step,t0+i*step+dur));css(w,{opacity:String(p),transform:`translateY(${(1-p)*dy}px)`,filter:p<1?`blur(${((1-p)*10).toFixed(1)}px)`:'none'})})}
function fadeUp(e,lt,t0,t1=1e9,dy=30,dur=.55){const a=E.outQ5(P(lt,t0,t0+dur)),b=E.ioC(P(lt,t1-.4,t1)),o=a*(1-b);css(e,{opacity:String(o),transform:`translateY(${((1-a)*dy-b*dy*.6).toFixed(1)}px)`,filter:o<.99?`blur(${((1-o)*8).toFixed(1)}px)`:'none'})}



/* ---------- Zusatz-Helfer ---------- */
const UL='assets/ueber-leben/';
const COVER_SRC=null; // sobald vorhanden: UL+'cover.jpg'
const fmt=n=>Math.round(n).toLocaleString('de-DE');
const SVGNS='http://www.w3.org/2000/svg';
function svg(parent,style,w,h){const e=document.createElementNS(SVGNS,'svg');e.setAttribute('width',w);e.setAttribute('height',h);e.setAttribute('viewBox',`0 0 ${w} ${h}`);e.classList.add('abs');Object.assign(e.style,style);parent.appendChild(e);return e}
function sv(parent,tag,attrs){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function drawPath(p,q){if(p._len==null){p._len=p.getTotalLength();p.style.strokeDasharray=p._len}css(p,{strokeDashoffset:String((p._len*(1-q)).toFixed(1))})}
function pop(e,lt,t0,dur=.5){const p=E.outB(P(lt,t0,t0+dur));css(e,{opacity:String(P(lt,t0,t0+dur*.3)),transform:`scale(${p.toFixed(3)})`})}
function book(parent,style){const b=el('div','book',style,parent);
  if(COVER_SRC){img(COVER_SRC,{left:0,top:0},b)}else{
    el('div','abs',{left:'60px',right:'40px',top:'70px',font:'600 24px IN',letterSpacing:'.12em',color:'#d8d2ca',textTransform:'uppercase'},b,'Miriam Meckel<br>Léa Steinacker');
    el('div','abs d',{left:'56px',right:'30px',top:'300px',font:'700 132px/.92 ID',color:'var(--copperL)',letterSpacing:'-.04em'},b,'Über<br>Leben');
    el('div','abs',{left:'60px',right:'50px',bottom:'80px',font:'500 27px/1.35 IN',color:'#e9e4dd'},b,'Ein Manifest für den Menschen in Zeiten von Superintelligenz')}
  return b}

/* ---------- Untertitel & Quellen (Bildschirm-Ebene) ---------- */
// Sprechtext: [Start, Dauer, [[Anzeige, gesprochen?], …]] – Dauer = gemessene Länge der Sprachaufnahme
const VO=[
 [3.5,6.70,[['Das Wort ist in der Politik angekommen.'],['Fachleute sagen: Heutige Modelle sind davon noch weit entfernt.']]],
 [10.6,2.65,[['Die Folgen spürt die Arbeitswelt schon heute.']]],
 [13.5,7.69,[['Allianz Partners will 1.500 bis 1.800 Stellen abbauen.','Allianz Partners will fünfzehnhundert bis achtzehnhundert Stellen abbauen. '],['Ergo rund 1.000, bis 2030.','Ergo rund tausend, bis zweitausenddreißig.']]],
 [21.5,7.59,[['Und 35 Prozent der Personalverantwortlichen','Und fünfunddreißig Prozent der Personalverantwortlichen '],['wollen wegen Künstlicher Intelligenz weniger Berufseinsteiger einstellen.']]],
 [29.6,1.41,[['Und unser Denken?']]],
 [31.3,10.36,[['Eine Studie mit 666 Menschen zeigt:','Eine Studie mit sechshundertsechsundsechzig Menschen zeigt: '],['Wer Denkarbeit oft an Künstliche Intelligenz abgibt,'],['denkt weniger kritisch.'],['Bei Jüngeren stärker.']]],
 [42.2,6.47,[['Genau hier setzen Miriam Meckel und Léa Steinacker an –'],['mit ihrem neuen Buch: Über Leben.']]],
 [49.2,2.34,[['Leben ist mehr als Information.']]],
 [52.0,3.10,[['Intelligenz ist mehr als Datenverarbeitung.']]],
 [55.6,2.53,[['Bewusstsein ist mehr als Denken.']]],
 [59.0,6.30,[['Ihr Rat: nicht den Maschinen ähnlicher werden,'],['sondern sich auf das besinnen, was uns unterscheidet.']]],
 [70.6,4.69,[['Schon ihr Buch „Alles überall auf einmal“'],['wurde zum Spiegel-Bestseller.']]],
 [76.0,4.67,[['Beide können Sie auch für Ihr Event anfragen –'],['über speakingstage.com.','über speakingstage punkt com.']]]];
const CAPS=[];VO.forEach(([t0,d,ch])=>{const w=ch.map(c=>(c[1]||c[0]).length),tot=w.reduce((a,b)=>a+b,0);let acc=0;
  ch.forEach((c,i)=>{const a=t0+d*acc/tot;acc+=w[i];const b=i===ch.length-1?t0+d+.35:t0+d*acc/tot;CAPS.push({t0:a,t1:b,html:c[0]})})});
const SRC=[[.2,3.45,'Quelle: DW, 04.10.2026',1],[3.5,10.5,'Quelle: DW, 04.10.2026',1],[10.6,29.3,'Quelle: tagesschau.de, 04.10.2026 · Kienbaum-Umfrage'],
 [29.5,42.0,'Quelle: Studie M. Gerlich, Swiss Business School, via alice.ch · Video: Hinterland of Things'],
 [42.2,49.0,'Quelle: Rowohlt-Vorschau'+(COVER_SRC?' · Cover © Rowohlt':'')],[49.3,58.8,'Quelle: Rowohlt-Vorschau'],[59.0,65.3,'Quelle: Rowohlt-Vorschau · Video: OMR'],
 [65.6,75.5,'Quelle: Rowohlt-Vorschau · Foto Léa Steinacker: Martin Gfrerer']].concat(COVER_SRC?[[76,84.6,'Cover © Rowohlt']]:[]);
let capLayer;
function buildOverlay(){capLayer=el('div','abs',{inset:0,zIndex:80,pointerEvents:'none'});
  CAPS.forEach(c=>{c.e=el('div','sub',{},capLayer,c.html)});SRC.forEach(c=>{c.e=el('div','src'+(c[3]?' dark':''),{},capLayer,c[2])})}
function drawOverlay(t){CAPS.forEach(c=>{if(t<c.t0-.05||t>c.t1+.05){css(c.e,{display:'none'});return}const o=P(t,c.t0,c.t0+.12)*(1-P(t,c.t1-.1,c.t1));
    css(c.e,{display:'block',opacity:String(o),transform:`translate(-50%,-50%) translateY(${((1-E.outC(P(t,c.t0,c.t0+.25)))*10).toFixed(1)}px)`})});
  SRC.forEach(c=>{const o=P(t,c[0],c[0]+.4)*(1-P(t,c[1]-.3,c[1]));css(c.e,{display:o>0?'block':'none',opacity:String(o)})})}

/* ==================================================================
   Szenen
   ================================================================== */

/* ---------- 1 · KI → Superintelligenz (0–3.5) ---------- */
Scene(0,3.5,s=>{s.root.classList.add('dk');css(s.root,{background:'var(--navy)'});
  s.lb=el('div','abs lbl',{left:0,width:'1080px',textAlign:'center',top:'470px',color:'var(--copperL)'},s.world,'US-Politik · Oktober 2026');
  s.g=el('div','abs',{left:0,top:0,width:'1080px',height:'1920px',transformOrigin:'540px 840px'},s.world);
  s.ki=el('div','abs d',{left:0,width:'1080px',textAlign:'center',top:'640px',font:'700 400px/1 ID',color:'#fff',letterSpacing:'-.04em'},s.g,'KI');
  s.st=el('div','abs',{left:'250px',top:'826px',width:'580px',height:'24px',background:'var(--copper)',borderRadius:'12px',transformOrigin:'0 50%'},s.g);
  s.su=el('div','big',{top:'610px',fontSize:'104px',color:'var(--copperL)'},s.world);s.wsu=words(s.su,'Superintelligenz');
  s.hl=el('div','abs d',{left:'90px',width:'900px',top:'1150px',textAlign:'center',font:'600 56px/1.2 ID',color:'#fff'},s.world);
  s.whl=words(s.hl,'Trump lässt US-Behörden <em>‚Superintelligenz‘</em> statt ‚KI‘ sagen.');
  s.K=keys([[0,{x:540,y:960,z:1.08,rz:-1}],[3.5,{x:540,y:960,z:1.0,rz:0}]]);
  s.update=lt=>{camera(s,lt,s.K,E.outC);fadeUp(s.lb,lt,.05);
    const a=E.outQ5(P(lt,0,.5)),m=E.io5(P(lt,1.05,1.6));
    css(s.ki,{opacity:String(a),transform:`scale(${(1.25-.25*a).toFixed(3)})`});
    css(s.st,{transform:`scaleX(${E.outQ5(P(lt,.6,.95)).toFixed(3)})`});
    css(s.g,{opacity:String(1-.78*m),transform:`translateY(${(m*150).toFixed(1)}px) scale(${(1-.42*m).toFixed(3)})`});
    revealWords(s.wsu,lt,1.2,.1,.6,60);revealWords(s.whl,lt,1.6,.07,.5,30);
    css(s.world,{opacity:String(1-P(lt,3.15,3.5))})};
});
sfx(.05,'bloom',.6);sfx(.6,'hit',.8);sfx(1.15,'whoosh',.7);sfx(1.25,'impact',.35);

/* ---------- 2 · Politik vs. Fachleute (3.5–10.7) ---------- */
Scene(3.5,10.7,s=>{s.root.classList.add('dk');css(s.root,{background:'var(--navy)'});
  s.t=el('div','abs d',{left:'80px',width:'920px',top:'300px',font:'700 96px/1.04 ID',color:'#fff',letterSpacing:'-.03em'},s.world);s.wt=words(s.t,'Das Wort ist in der <em>Politik</em> angekommen.');
  s.card=el('div','abs',{left:'60px',top:'780px',width:'960px',height:'560px',borderRadius:'34px',background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.14)'},s.world);
  s.cl=el('div','abs lbl',{left:'56px',top:'56px',color:'var(--copperL)'},s.card,'Einschätzung von Fachleuten');
  s.q=el('div','abs d',{left:'56px',top:'100px',width:'860px',font:'600 50px/1.15 ID',color:'#fff'},s.card);s.wq=words(s.q,'Heutige Modelle sind davon <em>noch weit entfernt.</em>');
  s.sg=svg(s.card,{left:0,top:0},960,560);
  s.l1=sv(s.sg,'line',{x1:110,y1:380,x2:270,y2:380,stroke:'#d9a074','stroke-width':8,'stroke-linecap':'round'});
  s.l2=sv(s.sg,'line',{x1:290,y1:380,x2:800,y2:380,stroke:'rgba(255,255,255,.55)','stroke-width':5,'stroke-dasharray':'14 14'});
  s.n1=sv(s.sg,'circle',{cx:110,cy:380,r:24,fill:'#d9a074'});
  s.n2=sv(s.sg,'circle',{cx:850,cy:380,r:38,fill:'none',stroke:'#fff','stroke-width':4,'stroke-dasharray':'8 7'});
  s.br=sv(s.sg,'path',{d:'M290 330 L290 312 L800 312 L800 330',fill:'none',stroke:'#d9a074','stroke-width':3});

/* ---------- Render ---------- */
function render(t){t=clamp(t,0,DUR);for(const s of SC){const on=t>=s.t0&&t<s.t1;css(s.root,{display:on?'block':'none'});if(on)s.update(t-s.t0,t)}drawOverlay(t)}

async function settle(){await Promise.all([...document.images].filter(i=>!i.complete).map(i=>new Promise(r=>{i.onload=i.onerror=r})));await Promise.all([...vp.querySelectorAll('img')].filter(i=>i.offsetParent!==null).map(i=>i.decode().catch(()=>{})))}
window.renderAt=async t=>{render(t);await settle();await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
function fitView(){if(RENDER)return;const s=Math.min(innerWidth/W,innerHeight/H);vp.style.transform=`scale(${s})`;vp.parentElement.style.cssText+=`;width:${W*s}px;height:${H*s}px`;document.getElementById('fit').style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff'}
addEventListener('resize',fitView);
const aud=document.getElementById('aud');let playing=false;
function loop(){if(!playing)return;render(aud.currentTime);if(aud.ended){playing=false;return}requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>{document.getElementById('start').style.display='none';playing=true;aud.currentTime=0;aud.play();loop()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(playing){playing=false;aud.pause()}else{playing=true;aud.play();loop()}}});
document.fonts.ready.then(()=>{fitView();if(RENDER||STILL!==null){document.getElementById('start').style.display='none'}render(STILL??0);window.__ready=true});
</script>
