<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucy Larbi – Showreel</title>
<style>
  @font-face{font-family:InterX;font-weight:900;src:url(assets/InterDisplay-Black.otf)}
  @font-face{font-family:InterX;font-weight:600;src:url(assets/Inter-SemiBold.otf)}
  :root{--navy:#162131;--navyD:#0d1520;--copper:#a7643c;--cream:#f7f3ee}
  html,body{margin:0;height:100%;background:var(--navyD);overflow:hidden;font-family:InterX,Inter,system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:var(--navy);display:block}
  #start{position:fixed;inset:0;display:grid;place-content:center;gap:18px;text-align:center;background:var(--navy);color:var(--cream);cursor:pointer;z-index:5}
  #start b{font-weight:900;font-size:clamp(28px,5vw,64px);letter-spacing:.04em}
  #start span{font-weight:600;font-size:clamp(12px,1.4vw,18px);letter-spacing:.32em;color:#d9a074}
  #start i{justify-self:center;width:84px;height:84px;border-radius:50%;background:var(--copper);display:grid;place-items:center;font-style:normal;font-size:30px;color:var(--cream);transition:transform .2s}
  #start:hover i{transform:scale(1.1)}
  #hint{position:fixed;left:16px;bottom:12px;color:#f7f3ee80;font:600 12px/1 InterX,system-ui;letter-spacing:.12em;z-index:4}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start"><span>SPEAKINGSTAGE PRÄSENTIERT</span><b>LUCY LARBI · SHOWREEL</b><i>▶</i><span>MIT TON · LEERTASTE = PAUSE · R = NEU STARTEN</span></div>
<div id="hint"></div>
<video id="vid" src="assets/footage.mp4" muted playsinline preload="auto" style="display:none"></video>
<audio id="aud" src="assets/music.m4a" preload="auto"></audio>

<script>
/* ============================================================
   Lucy Larbi – Showreel · SpeakingStage CI
   Alles ist eine reine Funktion der Zeit: render(t).
   120 BPM · 1 Beat = 0,5 s · Szenen sind in Beats getaktet.
   ?render=1 → Frame-genauer Export-Modus, ?t=12.5 → Standbild
   ============================================================ */
const W=1920,H=1080,FPS=30,BPM=120,BEAT=60/BPM,DUR=35.5,TAU=Math.PI*2;
const C={navy:'#162131',navyD:'#0d1520',navyL:'#2b3f5c',copper:'#a7643c',copperL:'#d9a074',cream:'#f7f3ee'};
const FONT='InterX,"Inter Display",Inter,system-ui,sans-serif';
const Q=new URLSearchParams(location.search);
const RENDER=Q.has('render'); const STILL=Q.has('t')?parseFloat(Q.get('t')):null;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const vid=document.getElementById('vid'),aud=document.getElementById('aud');

/* ---------- Mathe & Easing ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(b,a,c)=>clamp((b-a)/(c-a));
const rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const E={
  lin:x=>x, inQ:x=>x*x, outQ:x=>1-(1-x)*(1-x), outC:x=>1-Math.pow(1-x,3), outQ4:x=>1-Math.pow(1-x,4),
  ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, ioQ:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,
  outX:x=>x>=1?1:1-Math.pow(2,-10*x), ioX:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outB:x=>{const s=1.70158;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)},
  outE:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(TAU/3))+1
};
const kick=b=>Math.exp(-(b%1)*7);

/* ---------- Assets ---------- */
const IMG={}; const FR={}; const need=new Set(); let FOOT_LEN=12.1;
const loadImg=(k,src)=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r(i)};i.onerror=()=>r(null);i.src=src});
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function makeLUT(stops){const l=new Uint8ClampedArray(768);for(let i=0;i<256;i++){const v=i/255;let k=0;while(k<stops.length-2&&v>stops[k+1][0])k++;const[p0,c0]=stops[k],[p1,c1]=stops[k+1];const t=clamp((v-p0)/(p1-p0));for(let j=0;j<3;j++)l[i*3+j]=c0[j]+(c1[j]-c0[j])*t}return l}
// Gradient-Map in CI-Farben: Schatten Navy → Kupfer → Creme
const LUT=makeLUT([[0,hex(C.navyD)],[.2,hex(C.navy)],[.42,hex(C.navyL)],[.66,hex(C.copper)],[.85,hex(C.copperL)],[1,hex(C.cream)]]);
function gradeCanvas(c,gamma,gain){const x=c.getContext('2d',{willReadFrequently:true});try{const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){const l=(.299*a[i]+.587*a[i+1]+.114*a[i+2])/255;const v=Math.min(255,Math.round(255*Math.pow(l,gamma)*gain))*3;a[i]=LUT[v];a[i+1]=LUT[v+1];a[i+2]=LUT[v+2]}x.putImageData(d,0,0);return true}catch(e){return false}}
function duotone(img,gamma=1,gain=1,w=null){const c=document.createElement('canvas');const s=w?w/img.width:1;c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);gradeCanvas(c,gamma,gain);return c}
const FG=document.createElement('canvas');FG.width=960;FG.height=540;const fgx=FG.getContext('2d',{willReadFrequently:true});let fgKey=null,frameId=0;
function syncVid(ft){if(Math.abs(vid.currentTime-ft)>.25){try{vid.currentTime=ft}catch(e){}}if(vid.paused&&!STILL&&playing)vid.play().catch(()=>{})}
function footage(ft){
  ft=clamp(ft,0,FOOT_LEN-.05);let src,key;
  if(RENDER){const n=Math.round(ft*FPS);src=FR[n];key=n;if(!src){need.add(n);return FG}}
  else{if(STILL!==null&&vid.readyState<2)return FG;if(STILL!==null){try{vid.currentTime=ft}catch(e){}}else syncVid(ft);src=vid;key=frameId}
  if(key===fgKey&&!RENDER)return FG; if(RENDER&&key===fgKey)return FG;
  fgx.drawImage(src,0,0,960,540);gradeCanvas(FG,.62,1.45);fgKey=key;return FG;
}
const FOOT_A=0, FOOT_B=4.15;

/* ---------- Zeichen-Helfer ---------- */
function T(s,x,y,o={}){ctx.save();ctx.font=`${o.w||900} ${o.size||100}px ${FONT}`;ctx.letterSpacing=(o.ls||0)+'px';ctx.textAlign=o.a||'left';ctx.textBaseline=o.bl||'alphabetic';ctx.globalAlpha*=o.al??1;
  if(o.stroke){ctx.strokeStyle=o.stroke;ctx.lineWidth=o.sw||3;ctx.lineJoin='round';ctx.strokeText(s,x,y)}else{ctx.fillStyle=o.c||C.cream;ctx.fillText(s,x,y)}ctx.restore()}
function M(s,size,w=900,ls=0){ctx.save();ctx.font=`${w} ${size}px ${FONT}`;ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
const fit=(s,maxW,size,w=900,ls=0)=>Math.min(size,size*maxW/M(s,size,w,ls));
function clipRect(x,y,w,h,fn){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();fn();ctx.restore()}
// Text, der aus einer Maske nach oben fährt
function lineUp(s,x,y,size,p,o={}){const h=size*1.08,w=M(s,size,o.w||900,o.ls||0)+40;const ax=o.a==='right'?x-w:o.a==='center'?x-w/2:x;clipRect(ax-10,y-size*.86,w+20,h,()=>{T(s,x,y+(1-p)*h,{size,...o})})}
// MG-Block-Reveal: Farbblock fährt über die Zeile und gibt sie frei
function blockReveal(s,x,y,size,p,col,o={}){const w=M(s,size,o.w||900,o.ls||0),h=size*.98,top=y-size*.8;
  if(p<=0)return; if(p<.5){ctx.fillStyle=col;ctx.fillRect(x,top,w*E.ioQ(p*2),h);return}
  const q=E.ioQ((p-.5)*2),edge=x+w*q;clipRect(x-6,top-8,edge-x+6,h+16,()=>T(s,x,y,o));ctx.fillStyle=col;ctx.fillRect(edge,top,Math.max(0,x+w-edge),h)}
function poly(pts,fill){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function cover(img,sw,sh,x,y,w,h,zoom=1,fx=.5,fy=.5){const r=Math.max(w/sw,h/sh)*zoom,dw=sw*r,dh=sh*r;ctx.drawImage(img,x+(w-dw)*fx,y+(h-dh)*fy,dw,dh)}
function bg(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}
function star(cx,cy,r,n,col,rot=0,inner=.45){ctx.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr=i%2?r*inner:r;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=col;ctx.fill()}
function plus(x,y,s,col,w=2){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);ctx.stroke()}
function slash(x1,x2,sk,fill){poly([[x1,0],[x2,0],[x2-sk,H],[x1-sk,H]],fill)}
// Glitch: Footage/Bild in Streifen verschoben
function glitch(draw,amt,seed){if(amt<=0){draw();return}const n=9;for(let i=0;i<n;i++){const y0=H/n*i,hh=H/n+2,dx=(rnd(seed+i*3.1)-.5)*amt*(rnd(seed+i)>.45?1:.2);clipRect(0,y0,W,hh,()=>{ctx.save();ctx.translate(dx,0);draw();ctx.restore()})}}
function ringText(s,cx,cy,r,rot,size,col){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.font=`900 ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';const n=s.length;for(let i=0;i<n;i++){ctx.save();ctx.rotate(i/n*TAU);ctx.translate(0,-r);ctx.fillText(s[i],0,0);ctx.restore()}ctx.restore()}

/* ---------- Atmosphäre: Korn, Vignette, Raster ---------- */
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=rnd(i*.37)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c})();
const GRAIN_PAT=ctx.createPattern(GRAIN,'repeat');
const VIG=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const g=x.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*1.0);g.addColorStop(0,'rgba(13,21,32,0)');g.addColorStop(1,'rgba(13,21,32,.55)');x.fillStyle=g;x.fillRect(0,0,W,H);return c})();
function dotGrid(x0,y0,cols,rows,gap,col,a=.25,r=2){ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=col;for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){ctx.beginPath();ctx.arc(x0+i*gap,y0+j*gap,r,0,TAU);ctx.fill()}ctx.restore()}

/* ---------- Übergang: schräge CI-Streifen ---------- */
function wipe(b,Bc,dir=1){
  if(b<Bc-.55||b>Bc+.55)return;
  const sk=300*dir,p1=E.ioC(P(b,Bc-.5,Bc)),p2=E.ioC(P(b,Bc,Bc+.5)),far=W+420;
  const a=lerp(-far*.25,far,p1),z=lerp(-far*.25,far,p2); // Vorderkante / Hinterkante
  const X=(v)=>dir>0?v:W-v;
  const band=(l,r,col)=>{if(r<=l)return;const x1=X(l),x2=X(r);poly([[x1,0],[x2,0],[x2-sk,H],[x1-sk,H]],col)};
  band(z-30,a+30,C.cream);band(z+50,a-60,C.copper);band(z+140,a-150,C.navy);
}
function flash(b,Bc,col=C.cream,len=.28){if(b<Bc||b>Bc+len)return;ctx.save();ctx.globalAlpha=.85*(1-(b-Bc)/len);ctx.fillStyle=col;ctx.fillRect(0,0,W,H);ctx.restore()}
function slats(p,n,col,vertical=true){const s=(vertical?W:H)/n;ctx.fillStyle=col;for(let i=0;i<n;i++){const q=E.ioC(clamp(p*1.4-i/n*.4));const l=s*(1-q);if(vertical)ctx.fillRect(i*s,0,l+1,H);else ctx.fillRect(0,i*s,W,l+1)}}

/* ============================================================
   SZENE 0 · b 0–4 · Kaltstart: Schlagworte im Beat
   ============================================================ */
function S0(b){
  const i=Math.min(3,Math.floor(b)),lb=b-i;
  const words=['HALTUNG','VIELFALT','WANDEL','WIRKUNG'],bgs=[C.navy,C.copper,C.cream,C.navyD],fgs=[C.cream,C.navy,C.navy,C.cream],acc=[C.copper,C.cream,C.copper,C.copper];
  bg(bgs[i]);
  const w=words[i],size=fit(w,1560,360),p=E.outX(P(lb,0,.24)),sc=lerp(1.55,1,p),ls=lerp(60,0,p);
  // Raster & Kreuze
  dotGrid(90,90,38,20,48,fgs[i],.14);
  for(let k=0;k<6;k++)plus(160+k*330,140+(k%2)*800,12,acc[i],3);
  // Motiv pro Beat
  if(i===0){ctx.fillStyle=C.copper;const lw=E.outX(P(lb,0,.5))*W;ctx.fillRect((W-lw)/2,H/2+size*.32,lw,10)}
  if(i===1){for(let k=0;k<5;k++){const r=E.outX(P(lb,k*.05,.7+k*.05))*(250+k*170);ctx.strokeStyle=k%2?C.navy:C.cream;ctx.lineWidth=k%2?3:10;ctx.beginPath();ctx.arc(W/2,H/2,r,0,TAU);ctx.stroke()}}
  if(i===2){for(let k=0;k<9;k++){const q=E.outX(P(lb,k*.03,.5));ctx.fillStyle=k%2?C.copper:C.navy;ctx.fillRect(0,k*120,W*q*(k%2?1:.5),k%2?6:3)}}
  if(i===3){const q=E.ioX(P(lb,.35,1));const R=q*1500;ctx.fillStyle=C.copper;ctx.beginPath();ctx.arc(W/2+M(w,size)/2+10,H/2+size*.36,R,0,TAU);ctx.fill()}
  // Echo-Konturen
  ctx.save();ctx.translate(W/2,H/2+size*.34);ctx.scale(sc,sc);
  for(let k=4;k>=1;k--){T(w,0,-k*size*.12*p,{size,a:'center',stroke:acc[i],sw:3,al:.5-k*.1,ls})}
  const al=clamp(lb/.05);ctx.globalAlpha=al;
  // Wort mit farbigem Punkt
  const tw=M(w+'.',size,900,ls);T(w,-tw/2,0,{size,c:fgs[i],ls});T('.',-tw/2+M(w,size,900,ls),0,{size,c:i===3?C.cream:acc[i],ls});
  ctx.restore();
  // Zähler
  T('0'+(i+1)+' / 04',96,100,{size:26,w:600,c:fgs[i],ls:8});
  for(let k=0;k<4;k++){ctx.fillStyle=k<=i?acc[i]:fgs[i];ctx.globalAlpha=k<=i?1:.25;ctx.fillRect(96+k*70,H-110,56,8)}ctx.globalAlpha=1;
  T('SPEAKINGSTAGE',W-96,100,{size:26,w:600,c:fgs[i],ls:8,a:'right'});
}

/* ============================================================
   SZENE 1 · b 4–12 · Intro: Lucy Larbi
   ============================================================ */
function S1(b){
  const t=b*BEAT,ft=FOOT_A+(t-2),lb=b-4;
  bg(C.navyD);const f=footage(ft);
  if(b<8){
    const iris=E.outX(P(b,4.05,5.3));
    ctx.save();ctx.beginPath();ctx.arc(1330,540,iris*1500,0,TAU);ctx.clip();
    const z=lerp(1.28,1.42,P(b,4,8)),fx=lerp(.28,.22,P(b,4,8));
    glitch(()=>cover(f,960,540,0,0,W,H,z,fx,.5),(P(b,6,6.25)*(1-P(b,6.25,6.5))+P(b,7.5,7.7)*(1-P(b,7.7,8)))*90,Math.floor(b*8));
    // Verlauf für Lesbarkeit
    const g=ctx.createLinearGradient(0,0,W*.75,0);g.addColorStop(0,'rgba(13,21,32,.88)');g.addColorStop(1,'rgba(13,21,32,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.strokeStyle=C.copper;ctx.lineWidth=8;ctx.globalAlpha=1-P(b,5.2,5.6);ctx.beginPath();ctx.arc(1330,540,iris*1500,0,TAU);ctx.stroke();ctx.globalAlpha=1;
    // Titel
    const sz=330;
    lineUp('LUCY',90,500,sz,E.outX(P(b,4.6,5.2)),{c:C.cream});
    const p2=E.outX(P(b,4.9,5.5));
    clipRect(60,520,W,sz*1.1,()=>{ctx.translate(0,(1-p2)*sz);const fill=P(b,6.5,6.6);T('LARBI',90,800,{size:sz,stroke:C.copperL,sw:4,al:1-fill});if(fill>0)T('LARBI',90,800,{size:sz,c:C.copperL,al:fill})});
    // Tags
    const tg=E.outX(P(b,5.6,6.2));ctx.fillStyle=C.copper;ctx.fillRect(90,880,lerp(0,640,tg),70);clipRect(90,880,640,70,()=>T('KEYNOTE SPEAKERIN',120+(1-tg)*-400,928,{size:34,w:600,c:C.cream,ls:7}));
    const t2=E.outX(P(b,6.0,6.6));ctx.fillStyle=C.cream;ctx.fillRect(90,960,lerp(0,980,t2),52);clipRect(90,960,980,52,()=>T('DIVERSITY · LEADERSHIP · NEW WORK',112,997,{size:24,w:600,c:C.navy,ls:6,al:t2}));
    // vertikaler Text
    ctx.save();ctx.translate(W-70,H-100);ctx.rotate(-Math.PI/2);T('HAMBURG  ·  DE / EN  ·  AGILITÄT⁺',0,0,{size:22,w:600,c:C.cream,ls:8,al:P(b,5,6)*.8});ctx.restore();
    // Eck-Marker
    [[70,70],[W-70,70],[W-70,H-70],[70,H-70]].forEach(([x,y],k)=>plus(x,y,16*P(b,4.2,5),C.copperL,3));
  }else{
    // Jalousie: 6 Streifen mit Footage, wechselnd hoch/runter
    const n=6,sw=W/n;
    for(let k=0;k<n;k++){const p=E.outX(P(b,8+k*.09,8.85+k*.09)),dy=(1-p)*H*(k%2?1:-1);
      clipRect(k*sw,0,sw+1,H,()=>{ctx.save();ctx.translate(0,dy);cover(f,960,540,0,0,W,H,1.12+P(b,8,12)*.1,.5,.5);ctx.fillStyle='rgba(13,21,32,.25)';ctx.fillRect(0,0,W,H);ctx.restore()});
      ctx.fillStyle=C.copper;ctx.fillRect(k*sw,0,3,H)}
    // Marquee
    const mq=(s,y,size,dir,speed,stroke)=>{const w=M(s,size,900,0);let x=-((b*speed*dir)%w);if(dir<0)x=-w+((b*speed)%w);for(let k=-1;k<=Math.ceil(W/w)+1;k++){T(s,x+k*w,y,stroke?{size,stroke:C.cream,sw:4}:{size,c:C.copper})}};
    ctx.save();ctx.globalAlpha=E.outQ(P(b,8.3,9));mq('LEADERSHIP — AGILITÄT⁺ — DIVERSITY — NEW WORK — ',380,230,1,330,true);mq('LEADERSHIP — AGILITÄT⁺ — DIVERSITY — NEW WORK — ',860,230,-1,380,false);ctx.restore();
    // Zentraler Claim
    const cp=E.outB(P(b,9.2,9.9));ctx.save();ctx.translate(W/2,H/2);ctx.scale(cp,cp);const cw=M('BEGEISTERND.  SMART.  ANDERS.',74,900,6)+120;ctx.fillStyle=C.cream;ctx.fillRect(-cw/2,-60,cw,120);T('BEGEISTERND.  SMART.  ANDERS.',0,26,{size:74,c:C.navy,a:'center',ls:6});ctx.restore();
    T('02',W-96,100,{size:26,w:600,c:C.cream,ls:8,a:'right'});
  }
}

/* ============================================================
   SZENE 2 · b 12–20 · Gründerin · Keynoterin · Macherin
   ============================================================ */
function S2(b){
  const lb=b-12;bg(C.cream);
  dotGrid(100,100,40,22,46,C.navy,.12);
  // Kupferblock hinter dem Portrait
  const bp=E.outX(P(lb,.1,1.1)),pp=E.outX(P(lb,.4,1.6));
  ctx.fillStyle=C.copper;ctx.fillRect(1170,lerp(1080,120,bp),640,940);
  clipRect(1120,70,640,940,()=>{});
  ctx.save();ctx.beginPath();ctx.rect(1120,lerp(1010,70,pp),640,940*pp+.01);ctx.clip();
  const im=IMG.portrait;if(im)cover(im,im.width,im.height,1120,70,640,940,lerp(1.25,1.05,P(lb,.4,8)),.5,.2);
  ctx.restore();
  // Vertikales Label
  ctx.fillStyle=C.navy;ctx.fillRect(1760,lerp(1010,70,pp),44,940*pp);ctx.save();ctx.translate(1792,990);ctx.rotate(-Math.PI/2);T('LUCY LARBI · AGILITÄT⁺ · DIVERSITY',0,0,{size:20,w:600,c:C.cream,ls:8,al:pp});ctx.restore();

function logo(k,col){const key=k+col;if(LOGO_TINT[key])return LOGO_TINT[key];const im=IMG[k];if(!im)return null;const c=document.createElement('canvas');c.width=im.width*3;c.height=im.height*3;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return LOGO_TINT[key]=c}
function S7(b){
  const lb=b-56;bg(C.copper);dotGrid(100,100,40,22,46,C.navy,.12);
  lineUp('PLATTFORMEN',100,300,190,E.outX(P(lb,0,.6)),{c:C.navy});lineUp('& PARTNER.',100,490,190,E.outX(P(lb,.15,.75)),{c:C.cream});
  const keys=['logo_l1','logo_l2','logo_l3','logo_l4','logo_l5'],cw=420,gap=40,tot=keys.length*(cw+gap);
  [[620,1,300],[830,-1,340]].forEach(([y,dir,sp],r)=>{const off=(b*sp*dir)%tot;
    for(let i=-1;i<keys.length*2;i++){const kk=keys[((i+r*2)%keys.length+keys.length)%keys.length],p=E.outB(P(lb,.2+(i+1)*.06+r*.1,.8+(i+1)*.06+r*.1));let x=i*(cw+gap)+off;if(dir<0)x=i*(cw+gap)-((b*sp)%tot);if(x>W+cw||x<-cw)continue;
      ctx.save();ctx.translate(x+cw/2,y+85);ctx.scale(p,p);ctx.rotate((1-p)*.25*(i%2?1:-1));ctx.fillStyle=C.cream;ctx.fillRect(-cw/2,-85,cw,170);const l=(kk==='logo_l1'||kk==='logo_l3')?IMG[kk]:logo(kk,C.navy);if(l){const s=Math.min(280/l.width,100/l.height)*1.6;ctx.drawImage(l,-l.width*s/2,-l.height*s/2,l.width*s,l.height*s)}ctx.restore()}});
  T('GOOGLE · MOST WANTED: MUSIC · DEUTSCHE BAHN · WEWORK · BMWK',100,H-50,{size:22,w:600,c:C.navy,ls:6,al:P(lb,1,1.5)});
}

/* ============================================================
   SZENE 8 · b 60–71 · Finale: Name · CTA · Konfetti
   ============================================================ */
function S8(b){
  const t=b*BEAT,lb=b-60;bg(C.navyD);
  const f=footage(8.3+(t-30)),fa=(1-P(b,63,64.5))*.9;
  ctx.save();ctx.globalAlpha=fa;cover(f,960,540,0,0,W,H,lerp(1.1,1.35,P(b,60,66)),.5,.42);ctx.restore();
  ctx.save();ctx.globalAlpha=.55+.4*P(b,63,64.5);ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);ctx.restore();
  // Drehender Punktring
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(b*.12);ctx.strokeStyle=C.copper;ctx.lineWidth=3;ctx.setLineDash([2,22]);ctx.globalAlpha=E.outX(P(lb,0,1))*.7;ctx.beginPath();ctx.arc(0,0,560,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  // Name
  const up=E.ioX(P(b,63,64.2)),shift=-up*150;
  ['LUCY','LARBI'].forEach((s,i)=>{const sz=270,p=E.outB(P(b,60+i*.35,60.9+i*.35)),w=M(s,sz);ctx.save();ctx.translate(W/2,(i?740:480)+shift);ctx.scale(lerp(1.3,1,p),lerp(1.3,1,p));ctx.globalAlpha=clamp(p*3);
    for(let k=3;k>=1;k--)T(s,0,k*-18*(1-p),{size:sz,a:'center',stroke:C.copper,sw:3,al:(.4-k*.08)*(1-p)});
    T(s,0,0,{size:sz,a:'center',c:i?C.copperL:C.cream});ctx.restore()});
  // Subline
  const sp=E.outX(P(b,63.2,64.2));lineUp('KEYNOTE SPEAKERIN FÜR DIVERSITY · LEADERSHIP · NEW WORK',W/2,660,40,sp,{a:'center',c:C.cream,w:600,ls:6});
  const chips=['DEUTSCH · ENGLISCH','HAMBURG','HONORAR AUF ANFRAGE'];chips.forEach((s,i)=>{const p=E.outB(P(b,63.6+i*.18,64.4+i*.18)),w=M(s,26,600,5)+56,x=W/2+(i-1)*480;ctx.save();ctx.translate(x,750);ctx.scale(p,p);ctx.strokeStyle=C.copperL;ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-w/2,-34,w,68,34);ctx.stroke();T(s,0,9,{size:26,w:600,c:C.cream,a:'center',ls:5});ctx.restore()});
  // CTA-Button
  const cp=E.outB(P(b,64.4,65.2)),pul=1+.04*kick(b);ctx.save();ctx.translate(W/2,870);ctx.scale(cp*pul,cp*pul);
  ctx.strokeStyle=C.copper;ctx.lineWidth=4;ctx.globalAlpha=(1-(b%2)/2)*.8;ctx.beginPath();ctx.roundRect(-290-(b%2)*60,-60-(b%2)*30,580+(b%2)*120,120+(b%2)*60,70+(b%2)*30);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=C.copper;ctx.beginPath();ctx.roundRect(-290,-60,580,120,60);ctx.fill();T('JETZT ANFRAGEN  →',0,16,{size:46,c:C.cream,a:'center',ls:3});ctx.restore();
  // URL & Logo-Lockup
  lineUp('speakingstage.com/speaker/lucy-larbi',W/2,990,34,E.outX(P(b,65,65.7)),{a:'center',c:C.cream,w:600,ls:3});
  const lk=E.outX(P(b,60,61));const mk=logo('mark',C.cream);ctx.save();ctx.globalAlpha=lk;if(mk)ctx.drawImage(mk,96,64,56,56);T('SPEAKINGSTAGE',170,106,{size:28,c:C.cream,ls:8});ctx.restore();
  T('LUCY LARBI · SHOWREEL 2026',W-96,106,{size:24,w:600,c:C.copperL,ls:8,a:'right',al:lk});
  // Laufschrift unten
  {const s='LEADERSHIP ✦ AGILITÄT⁺ ✦ DIVERSITY ✦ NEW WORK ✦ INCLUSIVE ENTREPRENEURSHIP ✦ ',w=M(s,22,600,7),x=-((b*120)%w);ctx.save();ctx.globalAlpha=.5*E.outX(P(b,65,66));for(let i=0;i<4;i++)T(s,x+i*w,H-40,{size:22,w:600,c:C.copperL,ls:7});ctx.restore()}
  // Konfetti
  const tc=(b-64.4)*BEAT;if(tc>0){for(let i=0;i<120;i++){const a=-Math.PI/2+(rnd(i)-.5)*2.6,sp=500+rnd(i+9)*900,x=W/2+Math.cos(a)*sp*tc*(0.6+rnd(i+3)*.4),y=870+Math.sin(a)*sp*tc+1500*tc*tc;if(y>H+50)continue;ctx.save();ctx.translate(x,y);ctx.rotate(rnd(i+5)*TAU+tc*(rnd(i+2)-.5)*14);ctx.fillStyle=[C.copper,C.cream,C.copperL][i%3];ctx.globalAlpha=1-clamp((tc-1.6)/.8);ctx.fillRect(-9,-5,18,10);ctx.restore()}}
}

/* ---------- HUD ---------- */
function lightBg(b){return (b>=12&&b<20)||(b>=28&&b<32)||(b>=48&&b<50)||(b>=56&&b<60)}
function hud(b,t){
  if(b<4||b>=60)return;const light=lightBg(b),col=light?C.navy:C.cream,a=clamp((b-4)/1.5)*.9;
  ctx.save();ctx.globalAlpha=a;const mk=logo('mark',col);if(mk)ctx.drawImage(mk,96,40,34,34);
  const skip=(b>=20&&b<36)||(b>=44&&b<50)||(b>=1&&b<4)||(b>=4&&b<12);
  if(!skip||true){T('SPEAKINGSTAGE',144,66,{size:20,w:600,c:col,ls:7})}
  // Fortschritt
  const pr=t/DUR;ctx.fillStyle=col;ctx.globalAlpha=a*.25;ctx.fillRect(96,H-40,W-192,2);ctx.globalAlpha=a;ctx.fillStyle=light?C.copper:C.copperL;ctx.fillRect(96,H-41,(W-192)*pr,4);
  T(String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0'),W-96,H-52,{size:18,w:600,c:col,ls:5,a:'right'});
  ctx.restore();
}

/* ---------- Haupt-Render ---------- */
function shakeAmp(b){if(b<4)return 26;if(b>=20&&b<36)return 10;if(b>=36&&b<44)return 14;if(b>=60)return 10;return 8}
function render(t){
  frameId++;t=clamp(t,0,DUR);const b=t/BEAT;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle=C.navy;ctx.fillRect(0,0,W,H);
  const amp=shakeAmp(b),kp=Math.exp(-(b%1)*8),sx=(rnd(Math.floor(b*2)+1)-.5)*amp*kp,sy=(rnd(Math.floor(b*2)+7)-.5)*amp*kp;
  ctx.save();ctx.translate(sx,sy);ctx.beginPath();ctx.rect(-40,-40,W+80,H+80);ctx.clip();
  if(b<4)S0(b);else if(b<12)S1(b);else if(b<20)S2(b);else if(b<36)S3(b);else if(b<44)S4(b);else if(b<50)S5(b);else if(b<56)S6(b);else if(b<60)S7(b);else S8(b);
  ctx.restore();
  // Schnitte im Beat
  if(b<4){[1,2,3].forEach(B=>flash(b,B,C.cream,.2))}
  flash(b,38.5,C.cream,.3);flash(b,41,C.copper,.3);flash(b,53,C.copper,.3);
  if(b>=44&&b<50&&(b%2)<.25)flash(b,Math.floor(b/2)*2,C.cream,.2);
  hud(b,t);
  // Wipes (schräge CI-Streifen)
  [[4,1],[12,-1],[20,1],[24,-1],[28,1],[32,-1],[36,1],[44,-1],[50,1],[56,-1],[60,1]].forEach(([B,d])=>wipe(b,B,d));
  // Finish: Vignette & Korn
  ctx.save();ctx.globalAlpha=lightBg(b)?.28:1;ctx.drawImage(VIG,0,0);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.16;ctx.translate(Math.floor(rnd(frameId)*256),Math.floor(rnd(frameId+3)*256));ctx.fillStyle=GRAIN_PAT;ctx.fillRect(-256,-256,W+512,H+512);ctx.restore();
  // Ausblenden am Ende
  const fo=P(t,DUR-1.3,DUR);if(fo>0){ctx.fillStyle=`rgba(13,21,32,${fo})`;ctx.fillRect(0,0,W,H)}
}

/* ---------- Start & Wiedergabe ---------- */
let playing=false,t0=0;
async function boot(){
  await Promise.all([document.fonts.load('900 100px InterX'),document.fonts.load('600 24px InterX')]);
  await Promise.all([['portrait','assets/portrait.jpg'],['hero','assets/hero.jpg'],['stage','assets/stage.jpg'],['mark','assets/mark.png'],['logo_l1','assets/logo_l1.png'],['logo_l2','assets/logo_l2.png'],['logo_l3','assets/logo_l3.png'],['logo_l4','assets/logo_l4.png'],['logo_l5','assets/logo_l5.png']].map(a=>loadImg(...a)));
  if(IMG.hero)IMG.heroG=duotone(IMG.hero,1,1.05);
  if(IMG.stage)IMG.stageG=duotone(IMG.stage,.8,1.2);
  window.__ready=true;
}
function loop(){if(!playing)return;const t=aud.currentTime;if(aud.ended||t>=DUR-.02){aud.currentTime=0;aud.play();}render(aud.currentTime);requestAnimationFrame(loop)}
function play(){playing=true;document.getElementById('start').style.display='none';aud.currentTime=0;aud.play().catch(()=>{});vid.play().catch(()=>{});requestAnimationFrame(loop)}
document.getElementById('start').addEventListener('click',play);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(playing){playing=false;aud.pause();vid.pause()}else{playing=true;aud.play();vid.play();requestAnimationFrame(loop)}}if(e.key==='r'||e.key==='R'){aud.currentTime=0;if(!playing)play()}});
// Export-API (Playwright)
window.renderAt=async t=>{for(let i=0;i<4;i++){need.clear();render(t);if(!need.size)break;await Promise.all([...need].map(n=>new Promise(r=>{if(FR[n])return r();const im=new Image();im.onload=()=>{FR[n]=im;const ks=Object.keys(FR);if(ks.length>60){delete FR[ks.sort((a,b)=>a-b)[0]]}r()};im.onerror=r;im.src='frames/f'+String(n+1).padStart(4,'0')+'.jpg'})))}
  return cv.toDataURL('image/jpeg',.93).slice(23)};
boot().then(()=>{
  if(RENDER){document.getElementById('start').style.display='none';document.getElementById('stage').style.cssText='position:fixed;left:0;top:0';cv.style.cssText='width:1920px;height:1080px'}
  else if(STILL!==null){document.getElementById('start').style.display='none';vid.addEventListener('loadeddata',()=>setTimeout(()=>{render(STILL);window.__still=true},150));if(vid.readyState>=2)setTimeout(()=>{render(STILL);window.__still=true},150)}
  else render(0.9);
});
